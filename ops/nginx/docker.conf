worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format circlespace escape=json
        '{"timestamp":"$time_iso8601",'
        '"request_id":"$correlation_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream":"$upstream_addr"}';

    access_log /var/log/nginx/access.log circlespace;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    map $http_x_request_id $correlation_id {
        default $http_x_request_id;
        "" $request_id;
    }

    upstream circlespace_api {
        server api:8000;
        keepalive 32;
    }

    upstream circlespace_web {
        server web:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://circlespace_api;
            include /etc/nginx/proxy_params;
        }

        location = /health {
            proxy_pass http://circlespace_api;
            include /etc/nginx/proxy_params;
        }

        location = /health/ready {
            proxy_pass http://circlespace_api;
            include /etc/nginx/proxy_params;
        }

        location = /metrics {
            proxy_pass http://circlespace_api;
            include /etc/nginx/proxy_params;
        }

        location = /openapi.json {
            proxy_pass http://circlespace_api;
            include /etc/nginx/proxy_params;
        }

        location /docs {
            proxy_pass http://circlespace_api;
            include /etc/nginx/proxy_params;
        }

        location /redoc {
            proxy_pass http://circlespace_api;
            include /etc/nginx/proxy_params;
        }

        location / {
            proxy_pass http://circlespace_web;
            include /etc/nginx/proxy_params;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
